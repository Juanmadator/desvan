[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Juan Manuel Adame"]
repository = "https://github.com/Juanmadator/desvan"

[workspace.dependencies]
rayon = "1.12"
crossbeam-channel = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Memory",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
